services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kidsprogress:dev
    environment:
      NODE_ENV: development
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-and-make-it-long-enough}
      CORS_ORIGINS: http://localhost:5173
      DB_DRIVER: sqlite
      SQLITE_PATH: /data/kidsprogress.sqlite
      UPLOADS_PATH: /data/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - kidsprogress-data:/data
    restart: unless-stopped

volumes:
  kidsprogress-data:
    driver: local
